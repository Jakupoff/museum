<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Our Museum</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14100d; color: #f3ead9;
    font-family: Georgia, "Times New Roman", serif; -webkit-user-select: none; user-select: none; }
  #stage canvas { display: block; touch-action: none; }

  #intro { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; background: radial-gradient(ellipse at center, rgba(30,22,16,.78), rgba(10,8,6,.95));
    z-index: 10; transition: opacity .5s; }
  #intro.hidden { opacity: 0; pointer-events: none; }
  #intro h1 { font-size: clamp(40px, 8vw, 84px); font-weight: normal; margin: 0 0 8px; letter-spacing: .04em; }
  #intro p.sub { font-style: italic; color: #cbb89a; margin: 0 0 36px; font-size: clamp(16px, 2.6vw, 22px); }
  #intro button { font: inherit; font-size: 18px; letter-spacing: .12em; text-transform: uppercase; color: #14100d;
    background: #e8c98f; border: 0; padding: 14px 34px; border-radius: 999px; cursor: pointer; }
  #intro button:hover { background: #f3d9a8; }
  .field { font: inherit; font-size: 17px; color: #f3ead9; background: rgba(255,255,255,.06); border: 1px solid #6b5a45;
    border-radius: 999px; padding: 11px 20px; text-align: center; outline: none; width: 240px; margin-bottom: 16px; }
  .field:focus { border-color: #e8c98f; }
  .field.small { width: 120px; margin: 0; text-transform: uppercase; letter-spacing: .1em; }
  .together { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
  .together .or { color: #9d8b72; font-size: 14px; font-family: system-ui, sans-serif; }
  #intro button.ghost { background: transparent; color: #e8c98f; border: 1px solid #e8c98f; padding: 10px 22px; font-size: 14px; }
  #intro button.ghost:hover { background: rgba(232,201,143,.12); }
  #intro.paused .together, #intro.paused #name { display: none; }
  #netStatus { margin-top: 16px; min-height: 22px; color: #e8c98f; font-family: system-ui, sans-serif; font-size: 15px; }
  #netStatus b { font-size: 22px; letter-spacing: .12em; }
  #roomPill { position: fixed; top: 14px; left: 14px; z-index: 8; background: rgba(10,8,6,.6); padding: 7px 16px; border-radius: 999px;
    font: 14px system-ui, sans-serif; display: none; pointer-events: none; }
  #roomPill.show { display: block; }
  #toast { position: fixed; top: 14px; left: 50%; transform: translate(-50%, -80px); z-index: 25; background: rgba(232,201,143,.95);
    color: #14100d; padding: 9px 20px; border-radius: 999px; font: 15px system-ui, sans-serif; transition: transform .35s; pointer-events: none; }
  #toast.show { transform: translate(-50%, 0); }
  #intro .help { margin-top: 30px; color: #9d8b72; font-size: 14px; line-height: 1.8; font-family: system-ui, sans-serif; }
  kbd { border: 1px solid #6b5a45; border-radius: 4px; padding: 1px 6px; font-size: 12px; }

  #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%; background: rgba(255,255,255,.7); z-index: 5; pointer-events: none; }
  #hint { position: fixed; left: 50%; bottom: 14%; transform: translateX(-50%); z-index: 5; pointer-events: none;
    background: rgba(10,8,6,.6); padding: 8px 18px; border-radius: 999px; font-size: 15px; opacity: 0; transition: opacity .2s;
    font-family: system-ui, sans-serif; }
  #hint.show { opacity: 1; }

  #lightbox { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10,8,6,.94); opacity: 0; pointer-events: none; transition: opacity .3s; padding: 20px; cursor: pointer; }
  #lightbox.open { opacity: 1; pointer-events: auto; }
  #lightbox img { max-width: 92vw; max-height: 72vh; box-shadow: 0 20px 60px rgba(0,0,0,.6); border: 10px solid #f4efe6; }
  #lightbox h2 { font-weight: normal; margin: 22px 0 4px; font-size: 28px; }
  #lightbox .date { color: #cbb89a; font-style: italic; }
  #lightbox .note { max-width: 640px; text-align: center; color: #e4d7c2; margin-top: 10px; line-height: 1.5; }
  #lightbox .close { position: absolute; top: 14px; right: 22px; font-size: 13px; color: #9d8b72; font-family: system-ui, sans-serif; }

  #joy { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; z-index: 6;
    border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08); display: none; pointer-events: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
    background: rgba(255,255,255,.45); }
  #touchHelp { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; font: 13px system-ui, sans-serif;
    color: rgba(255,255,255,.55); z-index: 4; pointer-events: none; display: none; }
  body.touch #crosshair { display: none; }
  body.touch.started #touchHelp { display: block; }
</style>
</head>
<body>
  <div id="stage"></div>

  <div id="intro">
    <h1 id="introTitle">Our Museum</h1>
    <p class="sub" id="introSub"></p>
    <input id="name" class="field" placeholder="Your name" maxlength="16" autocomplete="off">
    <button id="enter">Enter</button>
    <div class="together">
      <button id="host" class="ghost">Visit together</button>
      <span class="or">or join:</span>
      <input id="code" class="field small" placeholder="CODE" maxlength="12" autocomplete="off">
      <button id="join" class="ghost">Join</button>
    </div>
    <div id="netStatus"></div>
    <div class="help" id="help">
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · mouse to look · <kbd>Shift</kbd> faster<br>
      <kbd>E</kbd> or click a photo to look closer · <kbd>Esc</kbd> pause · <kbd>M</kbd> music
    </div>
  </div>

  <div id="roomPill"></div>
  <div id="toast"></div>
  <div id="crosshair"></div>
  <div id="hint"></div>
  <div id="touchHelp">left thumb: walk · right thumb: look · tap a photo</div>
  <div id="joy"><div id="knob"></div></div>

  <div id="lightbox">
    <span class="close">click anywhere to close</span>
    <img id="lbImg" alt="">
    <h2 id="lbTitle"></h2>
    <div class="date" id="lbDate"></div>
    <div class="note" id="lbNote"></div>
  </div>

  <script src="photos.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="museum.js"></script>
</body>
</html>
